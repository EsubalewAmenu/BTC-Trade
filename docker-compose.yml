services:
  btc-paper-trader:
    build: .
    image: btc-paper-trader:local
    container_name: btc-paper-trader
    restart: unless-stopped
    init: true
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
